
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H.A AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f5f5f5;color:#333;
}
header{
 background:white;padding:18px;
 border-bottom:1px solid #ddd;
 font-size:22px;font-weight:bold;
}
header span{color:#777}
main{
 max-width:750px;margin:auto;
 padding:20px;height:80vh;
 display:flex;flex-direction:column;
}
#welcome{text-align:center;margin:auto;color:#555}
#messages{flex:1;overflow-y:auto}
.msg{
 padding:13px 16px;margin:12px 0;
 border-radius:15px;max-width:85%;
 line-height:1.5;white-space:pre-wrap;
}
.user{background:#e2e2e2;margin-left:auto}
.ai{background:white;border:1px solid #eee}
form{
 display:flex;gap:8px;background:white;
 padding:10px;border:1px solid #ddd;
 border-radius:16px;
}
input{
 flex:1;border:0;outline:none;
 font-size:16px;min-width:0;
}
button{
 border:0;background:#444;color:white;
 padding:12px 17px;border-radius:12px;
}
footer{text-align:center;color:#999;font-size:12px}
</style>
</head>
<body>
<header>◈ H.A <span>AI</span></header>
<main>
<div id="welcome">
<h2>Xin chào! 👋</h2>
<p>Tôi là H.A AI. Tôi có thể giúp gì cho bạn?</p>
</div>
<div id="messages"></div>
<form id="chat">
<input id="input" placeholder="Nhắn tin cho H.A AI..." autocomplete="off">
<button type="submit">Gửi</button>
</form>
<footer>H.A AI - Your smart assistant</footer>
</main>
<script>
const form=document.getElementById('chat');
const input=document.getElementById('input');
const messages=document.getElementById('messages');
const welcome=document.getElementById('welcome');

form.addEventListener('submit',function(e){
 e.preventDefault();
 const text=input.value.trim();
 if(!text)return;
 welcome.style.display='none';
 addMessage(text,'user');
 input.value='';
 setTimeout(()=>{
 addMessage('Xin chào! Tôi là H.A AI. Đây là bản giao diện thử nghiệm. Chúng ta sẽ kết nối trí tuệ nhân tạo thật ở bước tiếp theo nhé!','ai');
 },500);
});

function addMessage(text,type){
 const div=document.createElement('div');
 div.className='msg '+type;
 div.textContent=text;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
}
</script>
</body>
</html>
